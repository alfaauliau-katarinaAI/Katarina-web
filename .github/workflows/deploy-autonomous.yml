name: Deploy KATARINA Autonomous Free Worker and D1 (no paid services)

on:
  push:
    paths:
      - 'workers/**'
      - '.github/workflows/deploy-autonomous.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: katarina-autonomous-cloud
  cancel-in-progress: false

jobs:
  provision-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare account scope and locate D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::warning::No Cloudflare credentials; leaving autonomous Worker offline."
            exit 0
          fi
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          existing=$(curl --fail-with-body -sS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$endpoint?per_page=100")
          uuid=$(echo "$existing" | jq -r '.result[]|select(.name=="katarina-research-data")|.uuid' | head -n1)
          if [[ -z "$uuid" ]]; then
            echo "Creating one D1 database within the free tier."
            response=$(curl --fail-with-body -sS --max-time 20 -X POST "$endpoint" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"name":"katarina-research-data"}')
            uuid=$(echo "$response"| jq -er '.result.uuid')
          fi
          if [[ ! "$uuid" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "::error::Cloudflare returned an invalid D1 database identifier."
            exit 1
          fi
          echo "D1 is ready; writing ephemeral binding configuration."
          cat > workers/wrangler.generated.toml <<EOF
          name = "katarina-free-ingest"
          main = "autonomous.js"
          compatibility_date = "2026-10-12"
          workers_dev = true

          [triggers]
          crons = ["* * * * *"]

          [vars]
          FEED_SHARD = "0"

          [[d1_databases]]
          binding = "DB"
          database_name = "katarina-research-data"
          database_id = "$uuid"
          EOF
          # KV is optional. Never change billing or fail an existing D1 pipeline for KV permissions.
          kv_endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          kv_json=$(curl -sS --max-time 15 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$kv_endpoint?per_page=100" || true)
          kv_id=$(printf '%s' "$kv_json" | jq -r '.result[]?|select(.title=="katarina-edge-cache")|.id' | head -n1)
          if [[ -z "$kv_id" ]]; then
            echo "Requesting one free KV namespace, without activating billing."
            kv_response=$(curl -sS --max-time 20 -X POST "$kv_endpoint" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"title":"katarina-edge-cache"}' || true)
            kv_id=$(printf '%s' "$kv_response" | jq -r '.result.id // empty')
          fi
          if [[ "$kv_id" =~ ^[0-9a-f]{32}$ ]]; then
            cat >> workers/wrangler.generated.toml <<EOF

          [[kv_namespaces]]
          binding = "CACHE"
          id = "$kv_id"
          EOF
            echo "Free KV namespace and binding ready."
          else
            echo "::warning::KV edit permission unavailable. D1 and existing Worker stay operational."
          fi
          npx --yes wrangler@4 d1 execute katarina-research-data --remote --config workers/wrangler.generated.toml --file workers/schema.sql --yes
          npx --yes wrangler@4 deploy --config workers/wrangler.generated.toml
          sed -e 's/name = "katarina-free-ingest"/name = "katarina-free-ingest-b"/' \
              -e 's/FEED_SHARD = "0"/FEED_SHARD = "1"/' \
              workers/wrangler.generated.toml > workers/wrangler.second.toml
          for attempt in 1 2 3; do
            if npx --yes wrangler@4 deploy --config workers/wrangler.second.toml; then
              echo "Second feed collector deployed and shares the free D1 database."
              exit 0
            fi
            echo "::warning::Second worker deployment needs propagation; waiting before retry $attempt."
            sleep 20
          done
          echo "::error::Second worker deployment unavailable. First worker remains active in free mode."
          exit 1
