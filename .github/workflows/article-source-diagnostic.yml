name: Diagnose public news source accessibility
on:
  push:
    paths:
      - 'scripts/article-source-diagnostic.mjs'
      - '.github/workflows/article-source-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/article-source-diagnostic.mjs
