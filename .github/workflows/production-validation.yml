name: Validate KATARINA Cloudflare Production (bounded)

on:
  push:
    paths:
      - 'scripts/production-probe.mjs'
      - 'scripts/policy-production-check.mjs'
      - 'scripts/all-news-production-check.mjs'
      - 'scripts/real-article-evidence.mjs'
      - '.github/workflows/production-validation.yml'
  workflow_run:
    workflows:
      - "Deploy KATARINA Web to Cloudflare Pages (free)"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: katarina-prod-bounded-validation
  cancel-in-progress: false

jobs:
  validation:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit test AI fallback, public caching and API safety
        run: |
          npm test
          node --check website/app-v4.js
          node --check website/research-v5.js
          node --check website/hot-news.js
          node --check website/ka-shell.js
      - name: Read Cloudflare usage (no changes to account)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare-capacity-check.mjs
      - name: Bounded live traffic and single AI request
        run: node scripts/production-probe.mjs
      - name: Check BoJ headlines and source-grounded policy summaries
        run: node scripts/policy-production-check.mjs
      - name: Confirm articles beyond the first three are eligible for detailed AI
        run: node scripts/all-news-production-check.mjs
      - name: Read and analyze exact user-reported news from original publisher
        run: node scripts/real-article-evidence.mjs
      - name: Save only sanitized JSON measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katarina-production-probe
          path: test-results/*.json
          retention-days: 7
          if-no-files-found: ignore
