name: Deploy KATARINA Web to Cloudflare Pages (free)

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'functions/**'
      - 'lib/**'
      - 'tests/**'
      - 'package.json'
      - 'wrangler.toml'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: katarina-web-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Pages production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public website source
        uses: actions/checkout@v4

      - name: Verify existing Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to Katarina-web > Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Validate WhatsApp bot logic without sending messages
        run: npm test

      - name: Attach existing D1 database to Pages at deployment
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          result=$(curl --fail-with-body -sS --max-time 20 \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database?per_page=100")
          uuid=$(printf '%s' "$result" | jq -r '.result[]|select(.name=="katarina-research-data")|.uuid'|head -n1)
          if [[ -z "$uuid" ]]; then
            echo "::warning::No Cloudflare D1 instance; website continues to use RSS fallback."
          elif [[ "$uuid" =~ ^[0-9a-f-]{36}$ ]]; then
            cat >> wrangler.toml <<EOF

          [[d1_databases]]
          binding = "KATARINA_DB"
          database_name = "katarina-research-data"
          database_id = "$uuid"
          EOF
            echo "Configured KATARINA_DB as a free D1 Pages binding."
          else
            echo "::error::Invalid Cloudflare D1 identifier"
            exit 1
          fi

      - name: Prepare verified public KATARINA project updates
        env:
          GH_PUBLIC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/build-project-updates.py

      - name: Deploy existing katarina-research project (no new paid services)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website --project-name=katarina-research --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}


      - name: Disable legacy repository automatic Cloudflare deployments
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/katarina-research"
          before="$(curl -fsSL -H "Authorization: Bearer ${CF_TOKEN}" "$api")"
          echo "$before" | jq -e '.success == true' >/dev/null
          original="$(echo "$before" | jq -r '.result.source.config.repo_name // ""')"
          if [[ "$original" == "Katarina-AI" ]]; then
            enabled="$(echo "$before" | jq -r '.result.source.config.production_deployments_enabled // true')"
            preview="$(echo "$before" | jq -r '.result.source.config.preview_deployment_setting // "all"')"
            if [[ "$enabled" != "false" || "$preview" != "none" ]]; then
              echo "Disabling old Katarina-AI Git-triggered deployments; new Katarina-web Actions will deploy."
              payload='{"source":{"type":"github","config":{"production_deployments_enabled":false,"preview_deployment_setting":"none","deployments_enabled":false}}}'
              patched="$(curl -fsSL -X PATCH -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" --data "$payload" "$api")"
              echo "$patched" | jq -e '.success == true' >/dev/null
            fi
            verify="$(curl -fsSL -H "Authorization: Bearer ${CF_TOKEN}" "$api")"
            echo "$verify" | jq -e '.result.source.config.production_deployments_enabled == false and .result.source.config.preview_deployment_setting == "none"' >/dev/null
            echo "Legacy auto-deploy disabled successfully."
          else
            echo "Cloudflare source is not old Katarina-AI (${original}); no source settings changed."
          fi

      - name: Show production URLs
        run: |
          echo "Deployment requested from Katarina-web/main."
          echo "Production URL: https://katarina-research.pages.dev/"
